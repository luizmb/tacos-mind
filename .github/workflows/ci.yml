name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: swift build
        run: swift build 2>&1

      - name: swift test
        run: swift test 2>&1

      # xcodebuild in a non-interactive CI runner has no one to click "Trust & Enable" on
      # the SPM macro plugins (SwiftRexMacros, FPMacrosPlugin) this project depends on —
      # confirmed on this exact PR: "Macro ... must be enabled before it can be used".
      # These defaults are the standard headless-CI workaround.
      - name: Trust SPM macro plugins for headless xcodebuild
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # CODE_SIGNING_ALLOWED=NO: this runner has no "Mac Development"/"Apple Development"
      # certificate for the project's team ID, and CI only needs to confirm the code
      # builds, not produce a signed artifact.
      - name: xcodebuild TacosMind-macOS
        run: |
          xcodebuild build \
            -project TacosMind.xcodeproj \
            -scheme TacosMind-macOS \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1

      - name: xcodebuild TacosMind-iOS
        run: |
          xcodebuild build \
            -project TacosMind.xcodeproj \
            -scheme TacosMind-iOS \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1

  # Scoped to `swift build --target Meow` only, deliberately NOT `swift test` (even
  # filtered) — confirmed on this exact PR that `swift test --filter GeneratorCoreTests`
  # still fails, because `swift test` always resolves/compiles the WHOLE package before
  # test discovery/filtering ever runs, and `FileWatching` unconditionally uses
  # `DispatchSourceFileSystemObject`/`O_EVTONLY` (Apple Dispatch APIs, no Linux
  # equivalent). `--target` on `swift build` is the only form that actually stays scoped.
  # GeneratorCoreTests itself still runs — on the macOS job above, via the unscoped
  # `swift test`.
  test-linux:
    name: Build Meow (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Build Meow
        run: swift build --target Meow 2>&1
